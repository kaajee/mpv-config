# Check the following link for mpv's default keybindings:
# https://github.com/mpv-player/mpv/blob/master/etc/input.conf

# ==========    CUSTOM KEYBINDINGS    ==========

# Manual shader/profile overrides
# Auto-conditional profiles ([1440p+], [hd], [sdtv-ntsc]) handle the common cases.
# These keybindings let you override or force a specific shader set per file.
# CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/ArtCNN/ArtCNN_C4F16.glsl"; show-text "Shader: ArtCNN C4F16 (light)"            #! Video > Shaders > ArtCNN C4F16
# CTRL+2 no-osd change-list glsl-shaders set "~~/shaders/ArtCNN/ArtCNN_C4F32.glsl"; show-text "Shader: ArtCNN C4F32 (heavy)"            #! Video > Shaders > ArtCNN C4F32
# CTRL+3 no-osd change-list glsl-shaders set "~~/shaders/ArtCNN/ArtCNN_C4F16_DN.glsl"; show-text "Shader: ArtCNN C4F16 + Denoise"       #! Video > Shaders > ArtCNN C4F16 DN
# CTRL+4 no-osd change-list glsl-shaders set "~~/shaders/Ani4Kv2 and AniSD/Ani4Kv2_ArtCNN_C4F32_i2.glsl"; show-text "Shader: Ani4K v2"  #! Video > Shaders > Ani4K v2
# CTRL+5 no-osd change-list glsl-shaders set "~~/shaders/Ani4Kv2 and AniSD/AniSD_ArtCNN_C4F32_i4.glsl"; show-text "Shader: AniSD"       #! Video > Shaders > AniSD
# CTRL+6 apply-profile HighQuality; show-text "Profile: HighQuality"                                                                    #! Video > Profiles > HighQuality
# CTRL+7 apply-profile HDR; show-text "Profile: HDR (forced)"                                                                           #! Video > Profiles > Force HDR
# CTRL+8 apply-profile WEB-DL; show-text "Profile: WEB-DL (deband on)"                                                                  #! Video > Profiles > WEB-DL deband
# CTRL+9 apply-profile Anime; show-text "Profile: Anime (ArtCNN + CfL + deband)"                                                        #! Video > Profiles > Anime
# CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"                                                       #! Video > Shaders > Clear All
# c change-list glsl-shaders clr all                                                                                                    #! Video > Shaders > Clear All (alt)

# VIDEO
d cycle deband; show-text "Deband: ${deband}"
CTRL+I           cycle icc-profile-auto;show-text "ICC automatic color correction:${icc-profile-auto}"                        #menu: Screen > Toggle automatic icc color correction on/off        #@state=(icc_profile_auto and 'checked')

# AUDIO
a           cycle audio
A           cycle audio down
WHEEL_UP    add volume 2
WHEEL_DOWN  add volume -2
UP          add volume 2
DOWN        add volume -2
x           add audio-delay -0.05
X           add audio-delay +0.05


