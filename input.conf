##⇘⇘uosc Top-level menu: Other
CTRL+P           script-message cycle-commands "apply-profile FSRCNNX;show-text 'Profile: FSRCNNX'" "apply-profile FSRCNNX+;show-text 'Profile: FSRCNNX+'" "apply-profile NNEDI3;show-text 'Profile: NNEDI3'" "apply-profile ravu-zoom;show-text 'Profile: ravu-zoom'" "apply-profile Anime4K;show-text 'Profile: Anime4K'" #menu: Other > Profiles > Cycle Profiles
ALT+1            apply-profile FSRCNNX;show-text "Profile: FSRCNNX"                                                      #menu: Other > Profiles > Switch to FSRCNNX
ALT+2            apply-profile FSRCNNX+;show-text "Profile: FSRCNNX+"                                                    #menu: Other > Profiles > Switch to FSRCNNX+
ALT+3            apply-profile ravu-zoom;show-text "Profile: ravu-zoom"                                                  #menu: Other > Profiles > Switch to Ravu-zoom
ALT+4            apply-profile AnimeJaNai;show-text "Profile: AnimeJaNai"                                                #menu: Other > Profiles > Switch to AnimeJaNai
ALT+5            apply-profile Ani4K;show-text "Profile: Ani4K"                                                          #menu: Other > Profiles > Switch to Ani4K
ALT+6            apply-profile Anime4K;show-text "Profile: Anime4K"                                                      #menu: Other > Profiles > Switch to Anime4K
ALT+7            apply-profile AniSD;show-text "Profile: AniSD"                                                          #menu: Other > Profiles > Switch to AniSD
ALT+8            apply-profile NNEDI3;show-text "Profile: NNEDI3"                                                        #menu: Other > Profiles > Switch to NNEDI3
ALT+9            apply-profile NNEDI3+;show-text "Profile: NNEDI3+"                                                      #menu: Other > Profiles > Switch to NNEDI3+
#                apply-profile SSIM;show-text "Profile: SSIM"                                                            #menu: Other > Profiles > Switch to SSIM
#                cycle border;show-text "Show border: ${border}"                                                         #menu: Other > Toggle Border Mode  #@state=(border and 'checked')
CTRL+B           cycle title-bar;show-text "Show title bar: ${title-bar}"                                                #menu: Other > Toggle Title Bar    #@state=(title_bar and 'checked')
#                cycle-values title ${media-title} ${filename}                                                           #menu: Other > Toggle Media Title
~                script-binding console/enable                                                                           #menu: Other > Open Console
CTRL+R           cycle-values   reset-on-next-file "all" "no" "vf,af,loop-file,deinterlace,border,contrast,brightness,gamma,saturation,hue,video-zoom,video-rotate,video-pan-x,video-pan-y,panscan,speed,audio,sub,audio-delay,sub-pos,sub-scale,sub-delay,sub-speed,sub-visibility";show-text "Reset the following options on next file: ${reset-on-next-file}"   #menu: Other > Reset Changes Made During Playback
