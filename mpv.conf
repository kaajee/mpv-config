# vim: syntax=config
# Hybrid mpv.conf — Argon-style adaptive profiles + active gpu-next/Vulkan/nvdec stack
# Hardware target: i5-12450H + RTX 3050 6GB Laptop, 1440p144 panel
# Backup of previous config at: mpv.conf.bak

###########
# General #
###########
keep-open=yes
autofit=85%x85%
cursor-autohide=1000
cursor-autohide-fs-only
prefetch-playlist=yes
force-seekable=yes
hls-bitrate=max
input-ipc-server=/tmp/mpvsocket
load-auto-profiles=no                    # disable mpv built-in; the user script in scripts/ handles profiles
use-filedir-conf

# Logging niceties
msg-module
msg-color
term-osd-bar

# Watch later
write-filename-in-watch-later-config
watch-later-options-remove=fullscreen

##############################################
# ON SCREEN DISPLAY AND ON SCREEN CONTROLLER #
##############################################

osd-bar=no                                      # Don't show a huge volume box on screen when turning the volume up/down
osc=no                                          # Allows for custom OSC to be used
border=no                                       # Optional for modern OSC, but recommended
cursor-autohide-fs-only=yes                     # If this option is given, the cursor is always visible in windowed mode
                                                # In fullscreen mode, the cursor is shown or hidden according to --cursor-autohide
cursor-autohide=300                             # Cursor hide in ms   
osd-level=1                                     # https://mpv.io/manual/stable/#options-osd-level
osd-duration=1000                               # Set the duration of the OSD messages in ms
hr-seek=yes                                     # Select when to use precise seeks that are not limited to keyframes
                                                # https://mpv.io/manual/stable/#options-hr-seek

osd-font='Verdana'
osd-font-size=20
osd-color='#FFFFFF'                           # Hex code for white
osd-border-color='#000000'                    # Hex code for black
osd-border-size=0.6                             # Size for osd text and progress bar
osd-blur=0.2                                    # Gaussian blur factor. 0 means no blur applied (default)


################
# Video Output #
################
vo=gpu-next
gpu-api=vulkan
gpu-context=auto
hwdec=nvdec                              # change to auto-copy-safe if nvdec ever fails inside Flatpak
vd-lavc-dr=yes
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=1                     # 1 is correct on NVIDIA
icc-profile-auto


############
# Defaults #
############
# Sane fallbacks; quality buckets below override these per source.
scale=spline36
cscale=spline36
dscale=mitchell
scale-antiring=0.7
cscale-antiring=0.0
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
dither-depth=auto
temporal-dither=yes

# Banding off by default. Toggle per-file with `b`. Quality bucket may force on.
deband=no
deband-iterations=1
deband-threshold=35
deband-range=20
deband-grain=5

# Motion interpolation. Cheap on a 3050 + 144Hz panel; mitchell smoother than oversample
# at non-integer ratios (60→144).
video-sync=display-resample
interpolation=yes
tscale=oversample


#######
# HDR #
#######
tone-mapping=bt.2390
hdr-compute-peak=yes
target-prim=auto
target-trc=auto


#########
# Audio #
#########
audio-file-auto=fuzzy
audio-pitch-correction=yes
volume-max=200
volume=100


#############
# Subtitles #
#############
demuxer-mkv-subtitle-preroll=yes
demuxer-mkv-subtitle-preroll-secs=2
sub-filter-sdh=yes
sub-auto=all
sub-file-paths-append=ass
sub-file-paths-append=srt
sub-file-paths-append=sub
sub-file-paths-append=subs
sub-file-paths-append=subtitles
embeddedfonts=yes
sub-fix-timing=no
sub-ass-style-overrides=Kerning=yes
sub-use-margins
sub-ass-force-margins

# The following options only apply to subtitles without own styling
sub-font='Netflix Sans'
sub-font-size=40
sub-color='#FFFFFFFF'
sub-border-color='#FF000000'
sub-border-size=2.0
sub-shadow-color="#A0000000"
sub-shadow-offset=0.75
sub-spacing=0.0
sub-bold=yes


#############
# Languages #
#############
slang=en,eng,enm,id,ind
alang=ja,jpn,en,eng


[default]


###################
# Quality buckets #
###################
# Activation matrix (auto-profiles-functions.lua):
#   AC + fps<=61 + (<=4K | low-fps)   -> high
#   AC + fps>61  | (>4K & fps>61)     -> mid
#   Battery + fps<=61                 -> mid
#   Battery + fps>61 | (>4K & fps>31) -> low

[high-quality]
profile-cond=is_high(get('width', 0), get('height', 0), get('estimated-vf-fps', 0))
scale=ewa_lanczossharp
cscale=spline36
dscale=mitchell
scale-antiring=0.7
cscale-antiring=0.0
sigmoid-upscaling=yes
deband=yes
deband-iterations=2

[mid-quality]
profile-cond=is_mid(get('width', 0), get('height', 0), get('estimated-vf-fps', 0))
scale=spline36
cscale=spline36
dscale=mitchell
scale-antiring=0.7
cscale-antiring=0.0
sigmoid-upscaling=yes
deband=yes
deband-iterations=1

[low-quality]
profile-cond=is_low(get('width', 0), get('height', 0), get('estimated-vf-fps', 0))
scale=bicubic
cscale=bicubic
dscale=bicubic
scale-antiring=0
cscale-antiring=0
sigmoid-upscaling=no
deband=no


#############################
# Resolution-gated upscaler #
#############################
# Three mutually exclusive profiles; together they cover every source width.
# is_low gating prevents heavy NN shader from running when we already chose LOW.

[upscale-sub-hd]
# <720p source, but not LOW bucket -> light single-pass NN upscaler
profile-cond=get('width', 0) > 0 and get('width', 0) < 1280 and not is_low(get('width', 0), get('height', 0), get('estimated-vf-fps', 0))
glsl-shaders=~~/shaders/FSRCNN_x2_r2_8-0-2.glsl

[upscale-hd]
# 720p..1080p source, but not LOW -> full FSRCNNX
profile-cond=get('width', 0) >= 1280 and get('width', 0) <= 1920 and not is_low(get('width', 0), get('height', 0), get('estimated-vf-fps', 0))
glsl-shaders=~~/shaders/FSRCNNX_x2_8-0-4-1.glsl

[upscale-none]
# >1080p source OR LOW bucket -> no GLSL upscaler
profile-cond=get('width', 0) > 1920 or is_low(get('width', 0), get('height', 0), get('estimated-vf-fps', 0))
glsl-shaders=


###################################
# Protocol Specific Configuration #
###################################
[protocol.https]
cache=yes

[protocol.http]
cache=yes
