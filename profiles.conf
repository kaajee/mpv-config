########################
# Conditional Profile Group #
########################

##⇘⇘ Conditional profiles trigger specific parameters based on given conditions. See examples below for simple format
##   To convert a conditional profile to a general profile, just comment out --profile-cond and --profile-restore
##   General profiles are activated via --profile=<value>

##⇘⇘ Conditional profile format example:
##[FS-loop]                                                  # Profile name, customizable
##profile-desc    = Loop playback when fullscreen            # Profile description, not a parameter, free-form text
##profile-cond    = fullscreen                               # Condition to trigger this profile. Available properties: https://mpv.io/manual/master/#property-list
##profile-restore = copy                                     # Usually used to restore parameters to pre-trigger defaults (disabled = retain triggered values)
##...                                                        # Parameters to apply when condition is met
##...

##⇘⇘ Example: trigger profile based on specific characters in the filename
##   The character "-" must be escaped with Lua's "%" escape character
#[VCB-Studio]
#profile-desc=VCB-Studio releases
#profile-cond=filename:find("VCB%-Studio")~=nil
#profile-restore=copy
#deband=no

[SD]
 profile-desc=Enhancement for low-resolution sources
 profile-cond=height <= 720 and width <= 1280
 profile-restore=copy
#  profile=FSRCNNX+
profile=NVIDIA

[Deband]
 profile-desc=Enable debanding for sources below YUV420P10 # Forced off for 8K video
 profile-cond=get("video-params/average-bpp") < 24 and not (get("video-params/w") > 7000 or get("video-params/h") > 3000)
 profile-restore=copy
 deband=yes

#[hdr-2390]
# profile-cond=p.tone_mapping == "bt.2390" and p.current_vo == "gpu-next"
# profile-restore=copy
# tone-mapping-param=2.0

#[hdr-spline]
#profile-cond=p.tone_mapping == "spline"
#profile-restore=copy
#tone-mapping-param=1.0

[peak-percentile]
 profile-cond=get("video-params/avg-pq-y") < 0.21 and p.current_vo == "gpu-next"
 profile-restore=copy
 hdr-peak-percentile=99.8

[SDR-gamut]
 profile-desc=Gamut mapping for SDR content
 profile-cond=get("video-params/primaries") ~= "bt.709" and get("video-params/gamma") == "bt.1886"
 profile-restore=copy
 gamut-mapping-mode=clip

[SDR-target]
 profile-desc=SDR display target configuration
 profile-cond=get("video-params/gamma") == "bt.1886" and not get("inverse-tone-mapping") and p.current_vo == "gpu-next"
 profile-restore=copy
 target-colorspace-hint=no

#[RTX-HDR]
# Must disable [SDR-target] above for this to take effect
# profile-desc=SDR inverse tone mapping to HDR
# profile-cond=get("video-params/gamma") == "bt.1886" and get("video-target-params/max-luma") > 203 and p.current_vo == "gpu-next"
# profile-restore=copy
# inverse-tone-mapping=no
# target-colorspace-hint=auto
# vf-pre=@rtx-hdr:d3d11vpp=nvidia-true-hdr

[HDR]
 profile-desc=HDR configuration
 profile-cond=get("video-params/max-luma") > 203
 profile-restore=copy
 target-peak=auto
 target-colorspace-hint=auto
 target-colorspace-hint-mode=target
 hdr-reference-white=100
 blend-subtitles=no
 deband=no
 vf=""

[HDR-PASS]
 profile-desc=HDR passthrough parameters, only active in HDR display mode
 profile-cond=get("video-params/max-luma") > 203 and get("video-target-params/max-luma") > 203 and p.current_vo == "gpu-next"
 profile-restore=copy
 icc-profile=""
 icc-profile-auto=no
 target-colorspace-hint=auto
 target-colorspace-hint-mode=target
 inverse-tone-mapping=no      # Inverse tone mapping must not be enabled under HDR
 target-prim=auto
 #target-trc=scrgb            # Default auto; under HDR output this becomes pq
 #target-gamut=dci-p3         # or adobe, for argb gamut
 target-trc=auto
 target-peak=auto             # Or specify the HDR monitor's peak luminance; default fetches this automatically
 target-contrast=auto         # Or specify the HDR monitor's contrast ratio; default fetches this automatically
 #sub-hdr-peak=100            # Adjusts text subtitle brightness under HDR output; lower = darker
 #image-subs-hdr-peak=10000   # Adjusts image subtitle brightness under HDR output; higher = darker; example is max value

[video-sync]
 profile-desc=Switch A/V sync mode when audio speed correction exceeds threshold, to avoid noticeable pitch changes
 profile-cond=(speed * audio_speed_correction) > 0 and ((speed * audio_speed_correction) < 0.96 or (speed * audio_speed_correction) > 1.04) and not (get("estimated-vf-fps") > 47)
 profile-restore=copy-equal
 video-sync=display-tempo

[fps-fix]
 profile-desc=Fix abnormal power usage or dropped frames caused by high video FPS or high display refresh rate
 profile-cond=get("estimated-vf-fps") > 47 or get("display-fps") > 120
 profile-restore=copy
 video-sync=audio

[8k-fix]
 profile-desc=Drop shaders/deband/filters and switch to audio sync for 8K sources to reduce dropped frames
 profile-cond=get("video-params/w") > 7000 or get("video-params/h") > 3000
 profile-restore=copy
 video-sync=audio
 glsl-shaders=""
 deband=no
 vf=""

[pgs-fix]
 profile-desc=Fix PGS subtitle misalignment caused by aspect ratio mismatch
 profile-cond=get("video-params/aspect") > 16 / 9 and get("current-tracks/sub/codec") == "hdmv_pgs_subtitle"
 profile-restore=copy
 stretch-image-subs-to-screen=yes

